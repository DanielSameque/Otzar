services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: otzar-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      # O SQL Server exige senha forte: 8+ caracteres com maiúsculas, minúsculas, números e símbolos.
      MSSQL_SA_PASSWORD: Otzar@Dev2025
    ports:
      - '1433:1433'
    volumes:
      - otzar-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # A imagem do SQL Server não cria bancos por variável de ambiente.
  # Este serviço roda uma vez e cria o banco "otzar" se ainda não existir.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: otzar-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: Otzar@Dev2025
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID('otzar') IS NULL CREATE DATABASE otzar"
    restart: 'no'

volumes:
  otzar-sqlserver-data:
