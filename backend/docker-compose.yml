services:
  postgres:
    image: postgres:16-alpine
    container_name: otzar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: otzar
      POSTGRES_PASSWORD: otzar
      POSTGRES_DB: otzar
    ports:
      - '5432:5432'
    volumes:
      - otzar-postgres-data:/var/lib/postgresql/data

volumes:
  otzar-postgres-data:
